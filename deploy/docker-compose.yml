# RepairHub PRODUCTION deployment. Run from this directory:
#   cd deploy && docker compose up -d --build
# Reads deploy/.env (copy .env.example). Separate from the development compose file in the repository root:
# its own project name, volumes and settings, so the two never share data.

name: repairhub-prod

x-database-env: &database-env
  ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-repairhub};Username=${POSTGRES_USER:-repairhub};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env};GSS Encryption Mode=Disable"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repairhub}
      POSTGRES_USER: ${POSTGRES_USER:-repairhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    # No published port: the database is reachable only from the API inside the Docker network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations, then exits. The API starts only after it succeeded, so there is
  # exactly one migration runner per deployment, never one per API instance.
  migrate:
    image: repairhub/api:${RH_VERSION:-latest}
    build:
      context: ../backend
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-env
      ASPNETCORE_ENVIRONMENT: Production
    networks: [backend]

  api:
    image: repairhub/api:${RH_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-env
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env (at least 32 characters)}
      Database__ApplyMigrationsOnStartup: "false"
      # Only the reverse proxy (fixed address below) may set X-Forwarded-For / X-Forwarded-Proto.
      ReverseProxy__TrustedProxies__0: 172.30.99.10
    # No published port: reachable only through the reverse proxy.
    networks: [backend]
    healthcheck:
      # The aspnet image has no curl/wget; bash's /dev/tcp is enough for one HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Scheduled pg_dump backups with verification and retention (deploy/backup/rh-backup.sh). Connects to the
  # database over the internal network like the API; never restores anything by itself.
  backup:
    image: repairhub/backup:${RH_VERSION:-latest}
    build:
      context: ./backup
    restart: unless-stopped
    init: true # forwards SIGTERM, so "docker compose stop" does not wait for the timeout
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-repairhub}
      PGUSER: ${POSTGRES_USER:-repairhub}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      # Only SCRAM: the password itself is never sent. Matters when the database container is down: Docker's
      # DNS then forwards "postgres" to the host's resolver, which may answer with an address outside.
      PGREQUIREAUTH: scram-sha-256
      TZ: ${BACKUP_TZ:-Asia/Almaty}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      # A host directory, outside the database volume, so the administrator can copy the files off the server.
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Unhealthy when the last attempt failed or the newest backup is older than BACKUP_MAX_AGE_HOURS.
      test: ["CMD", "rh-backup", "health"]
      interval: 1m
      timeout: 10s
      retries: 1
      start_period: 5m

  web:
    image: repairhub/web:${RH_VERSION:-latest}
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RH_SITE_ADDRESS: ${RH_SITE_ADDRESS:?Set RH_SITE_ADDRESS in deploy/.env (domain name or LAN IP)}
      RH_TLS: ${RH_TLS:?Set RH_TLS in deploy/.env (internal, or the e-mail for Let's Encrypt)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and the local CA: keep, or certificates are re-issued
      - caddy-config:/config
    networks:
      backend:
        ipv4_address: 172.30.99.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.99.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
